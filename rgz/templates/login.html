<!DOCTYPE html>
<html>
<head>
    <title>Авторизация</title>
</head>
<body>

<h2>Авторизация</h2>

<form method="POST">

    <input type="text" name="name" placeholder="Логин" required>
    <br><br>

    <input type="password" name="password" placeholder="Пароль" required>
    <br><br>

    <button type="submit">
        Войти
    </button>

</form>

{% with messages=get_flashed_messages() %}
{% if messages %}
    {% for msg in messages %}
        <div>{{msg}}</div>
    {% endfor %}
{% endif %}
{% endwith %}

</body>
</html>

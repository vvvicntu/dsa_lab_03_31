<!DOCTYPE html>
<html>
<head>
    <title>Добавление операции</title>
</head>

<body>

<h2>Добавление операции</h2>

<form method="POST">

Дата:
<input type="date" name="date" required>
<br><br>

Сумма:
<input type="number" step="0.01" name="sum" required>
<br><br>

Тип:
<select name="type_operation">

<option value="доходы">
Доход
</option>

<option value="расходы">
Расход
</option>

</select>

<br><br>

Комментарий:

<input type="text" name="comment">

<br><br>

<button type="submit">
Добавить
</button>

</form>

{% with messages=get_flashed_messages() %}
{% if messages %}
{% for msg in messages %}
<p>{{msg}}</p>
{% endfor %}
{% endif %}
{% endwith %}

</body>
</html>
